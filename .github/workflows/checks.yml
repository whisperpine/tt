name: Checks

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    runs-on: ubuntu-latest
    name: check misspelling by typos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run typos command
        shell: nix shell --inputs-from . nixpkgs#typos --quiet --command bash {0}
        run: sh ./scripts/check-typos.sh

  cocogitto:
    runs-on: ubuntu-latest
    name: check conventional commits
    # Only run this step in the main branch.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Check the latest commit message
        shell: nix shell --inputs-from . nixpkgs#cocogitto --quiet --command bash {0}
        run: cog check HEAD..HEAD

  rumdl:
    name: lint markdown by rumdl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run rumdl command
        shell: nix shell --inputs-from . nixpkgs#rumdl --quiet --command bash {0}
        run: rumdl check .

  cargo-clippy:
    runs-on: ubuntu-latest
    name: lint rust code by clippy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[superfluous-actions]
        with:
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: |
          cargo clippy --release -- -D warnings
          cargo clippy --examples --release -- -D warnings
          cargo clippy --tests -- -D warnings

  cargo-doc:
    runs-on: ubuntu-latest
    name: lint rust docstring by rustdoc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[superfluous-actions]
        with:
          components: rust-docs
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo doc
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          cargo test --doc

  cargo-fmt:
    name: check rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[superfluous-actions]
        with:
          components: rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo fmt
        run: cargo fmt --check

  gen-up-to-date:
    runs-on: ubuntu-latest
    name: check if generated code is update to date
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Generate code from openapi specifications
        shell: nix develop .#gen --quiet --command bash {0}
        run: |
          sh ./scripts/gen-rust-axum.sh
          sh ./scripts/git-status.sh

  trivy-scan:
    name: use trivy to scan files
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run Trivy vulnerability scanner in repo mode
        shell: nix shell --inputs-from . nixpkgs#trivy --quiet --command bash {0}
        run: |
          trivy --quiet fs . \
            --output trivy-fs-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --skip-dirs ./target \
            --format sarif \
            --exit-code 1
          trivy --quiet config . \
            --output trivy-config-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --skip-dirs ./target \
            --format sarif \
            --exit-code 1
      - name: Upload "trivy fs" results to GitHub Security tab
        if: ${{ success() || failure() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs-scan
      - name: Upload "trivy config" results to GitHub Security tab
        if: ${{ success() || failure() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config-scan

  zizmor:
    name: lint github actions by zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run zizmor command
        shell: nix shell --inputs-from . nixpkgs#zizmor --quiet --command bash {0}
        run: zizmor --persona=pedantic .github
