name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "openapi/**"
  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-github-pages:
    name: build and deploy github pages
    environment:
      name: openapi-docs
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to check out the repository
      pages: write # required to deploy the GitHub Pages artifact
      id-token: write # required for the OIDC token used by "deploy-pages"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: cachix/install-nix-action@v31
      - name: Generate OpenAPI documentation
        shell: nix shell --inputs-from . nixpkgs#redocly --quiet --command bash {0}
        run: sh ./scripts/build-docs.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "./pages"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
